<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusAI - Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>

    <div class="auth-container">

        <!-- LOGIN VIEW -->
        <div id="loginView">
            <div class="auth-header">
                <h1>CampusAI</h1>
                <p>Sign in to access your intelligence dashboard</p>
            </div>

            <div id="loginAlert" class="alert"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="student@campus.edu" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">Secure Login</button>
            </form>

            <div class="auth-switch">
                Don't have an account? <span id="showRegister">Create Account</span>
            </div>
        </div>

        <!-- REGISTER VIEW -->
        <div id="registerView" class="hidden">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join CampusAI to accelerate your learning</p>
            </div>

            <div id="registerAlert" class="alert"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" placeholder="Jon Doe" required>
                </div>
                <div class="form-group">
                    <label for="regRole">I am a</label>
                    <select id="regRole" required>
                        <option value="student">Student</option>
                        <option value="faculty">Faculty</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" placeholder="user@campus.edu" required>
                </div>

                <div class="form-group">
                    <label for="regDepartment">Department</label>
                    <select id="regDepartment" required>
                        <option value="">Loading...</option>
                    </select>
                </div>

                <!-- Student-only fields -->
                <div id="studentFields">
                    <div style="display: flex; gap: 15px;">
                        <div class="form-group" style="flex: 1;">
                            <label for="regBatch">Batch</label>
                            <select id="regBatch" required>
                                <option value="">Select Dept First</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label for="regSemester">Semester</label>
                            <select id="regSemester" required>
                                <option value="">Select</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Faculty-only fields -->
                <div id="facultyFields" class="hidden">
                    <div class="form-group">
                        <label for="regDesignation">Designation</label>
                        <select id="regDesignation">
                            <option value="Assistant Professor">Assistant Professor</option>
                            <option value="Associate Professor">Associate Professor</option>
                            <option value="Professor">Professor</option>
                            <option value="HOD">HOD</option>
                            <option value="Lecturer">Lecturer</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirm Password</label>
                    <input type="password" id="regConfirmPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn" id="registerBtn">Create Account</button>
            </form>

            <div class="auth-switch">
                Already have an account? <span id="showLogin">Sign In</span>
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="/static/js/auth.js"></script>
</body>

</html>
