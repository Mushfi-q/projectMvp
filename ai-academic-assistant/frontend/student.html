<!DOCTYPE html>
<html>

<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <h2>Student Dashboard</h2>

    <button onclick="logout()">Logout</button>

    <hr>

    <h3>Your Assignments</h3>
    <ul id="assignmentsList"></ul>

    <hr>

    <h3>Your Marks</h3>
    <ul id="marksList"></ul>

    <hr>

    <h3>AI Assistant</h3>
    <select id="subjectSelect">
        <option value="1">Subject 1</option>
    </select><br><br>

    <input type="text" id="chatInput" placeholder="Ask something..." style="width:300px;">
    <button onclick="sendMessage()">Send</button>

    <p id="chatResponse"></p>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
        }

        function logout() {
            localStorage.removeItem("token");
            window.location.href = "login.html";
        }

        // Fetch Assignments
        async function loadAssignments() {
            try {
                const response = await fetch(`${API_BASE}/student/assignments`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) return;
                const data = await response.json();
                const list = document.getElementById("assignmentsList");
                list.innerHTML = "";

                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach(a => {
                        const li = document.createElement("li");
                        li.innerText = `${a.title} - Deadline: ${new Date(a.deadline).toLocaleDateString()}`;
                        list.appendChild(li);
                    });
                }
            } catch (e) { console.error("Error loading assignments", e); }
        }

        // Fetch Marks
        async function loadMarks() {
            try {
                const response = await fetch(`${API_BASE}/student/marks`, {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (!response.ok) return;
                const data = await response.json();
                const list = document.getElementById("marksList");
                list.innerHTML = "";

                if (data.data && Array.isArray(data.data)) {
                    data.data.forEach(m => {
                        const li = document.createElement("li");
                        li.innerText = `Subject ${m.subject_offering_id}: ${m.marks_obtained}/${m.max_marks}`;
                        list.appendChild(li);
                    });
                }
            } catch (e) { console.error("Error loading marks", e); }
        }

        // Chat
        async function sendMessage() {
            const message = document.getElementById("chatInput").value;
            const subjectId = document.getElementById("subjectSelect").value;
            document.getElementById("chatResponse").innerText = "Thinking...";

            try {
                const response = await fetch(`${API_BASE}/chat/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        subject_offering_id: parseInt(subjectId),
                        message: message
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById("chatResponse").innerText = data.data;
                } else {
                    document.getElementById("chatResponse").innerText = "Error: " + (data.detail || "Internal Server Error");
                }
            } catch (e) {
                document.getElementById("chatResponse").innerText = "Network Error.";
            }
        }

        // Load on page start
        loadAssignments();
        loadMarks();
    </script>

</body>

</html>
